function businessPage(){return `<section class="business-hero"><div class="wrap hero hero-grid"><div><div class="eyebrow">Equip for businesses</div><h1>Less chasing.<br><span>More doing.</span></h1><p class="intro">Apps, connected systems and automation built around the way your business works.</p><p class="business-hero-text">Start with the task that takes too long, the spreadsheet everyone depends on, or the information that keeps getting lost.</p><div class="actions">${button('Explore the examples','#business-examples')}${button('Tell us what you need','#/enquiry?type=Business',true)}</div></div><div class="business-summary"><div class="business-window-top"><span class="equip-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>YOUR WORK. IN ONE VIEW.</span><span class="demo-label">Illustrative demo</span></div><div class="business-summary-body"><p class="tag">Cedar Works / Team workspace</p><h3>A clearer working day.</h3><div class="business-summary-row"><span class="business-icon">01</span><div><strong>Hiring</strong><small>Applications and next steps</small></div><span class="business-chip">Review</span></div><div class="business-summary-row"><span class="business-icon">02</span><div><strong>Clients</strong><small>Documents and approvals</small></div><span class="business-chip peach">Action needed</span></div><div class="business-summary-row"><span class="business-icon">03</span><div><strong>Operations</strong><small>Assigned work and requests</small></div><span class="business-chip">In progress</span></div><p class="demo-hint">Fictional workspace showing possible systems, not one connected product.</p></div></div></div></section><section class="section" id="business-examples"><div class="wrap"><div class="business-heading">${heading('Explore the work','See what a system could change.')}<p>Choose an example and try the workflow. Each starts with a recognisable piece of everyday work.</p></div><div class="business-tabs" aria-label="Business examples">${Object.entries(businessDescriptions).map(([key,d],i)=>`<button type="button" class="business-tab" data-business-view="${key}" aria-pressed="${key==='hiring'}"><span>0${i+1}</span>${d[0]}</button>`).join('')}</div><div class="business-workbench"><div id="business-explanation" class="business-explanation"></div><div><div class="panel business-panel"><div class="panel-top"><span><span class="school-mark">C</span> Cedar Works</span><span class="demo-label">Interactive example</span></div><div id="business-demo" class="dashboard"></div></div><p class="product-caption">Synthetic data. Actions affect this demonstration only; nothing is sent, booked, uploaded or approved in a real system.</p></div></div></div></section><section class="section business-opportunities"><div class="wrap">${heading('Other starting points','What else needs a better home?')}<div class="business-opportunity-grid">${[['Sales & enquiries','Track an enquiry from first contact to a quotation and follow-up.'],['Onboarding','Collect information and coordinate the tasks for a new employee, client or supplier.'],['Equipment & maintenance','See where equipment is, report faults and keep service dates visible.'],['Orders & suppliers','Keep supplier information, orders and delivery updates together.'],['Reporting dashboards','Bring agreed information into a useful view of work and performance.'],['Connected workflows','Explore moving information between tools where access and compatibility allow.']].map(([title,desc])=>`<article><h3>${title}</h3><p>${desc}</p></article>`).join('')}</div><p class="quiet">These are possibilities for discovery and custom development. Any integrations need to be checked before they are promised.</p></div></section>${ways()}${process()}<section class="section dark"><div class="wrap callout"><div><div class="eyebrow">Start with your business</div><h2>Bring us the problem.</h2><p class="cta-solution">and we&#8217;ll build the solution</p></div>${button('Discuss your business','#/enquiry?type=Business')}</div></section>`;}
function renderBusinessDemo(){const copy=document.querySelector('#business-explanation'),box=document.querySelector('#business-demo');if(!copy||!box)return;const d=businessDescriptions[businessView];copy.innerHTML=`<span class="tag">${d[0]}</span><h2>${d[1]}</h2><p>${d[2]}</p><p class="review-note">${d[3]}</p>${button('Discuss something like this','#/enquiry?type=Business',true)}`;

 box.innerHTML=`<span class="tag">Hiring / Applications</span><h3>The next step, in view.</h3><div class="business-mini-stats"><div><b>2</b><span>Open roles</span></div><div><b>3</b><span>Sample applications</span></div></div><label for="business-candidate-filter">Filter by stage</label><select id="business-candidate-filter">${['All','Received','Shortlisted','Interview'].map(x=>`<option ${businessFilter===x?'selected':''}>${x}</option>`).join('')}</select><div class="business-records">${filtered.map(([name,role,stage])=>`<article class="business-record"><div><strong>${name}</strong><small>${role}</small></div><span class="business-chip">${stage}</span></article>`).join('')||'<p class="quiet">No sample applications at this stage.</p>'}</div><div class="business-action-card"><span class="tag">Selected application</span><h3>Taylor Mason</h3><p>Operations coordinator / Application received</p><p class="business-status" role="status">Current stage: ${businessCandidate}</p><div class="demo-actions"><button data-business-shortlist ${businessCandidate!=='Received'?'disabled':''}>Shortlist Taylor</button><button data-business-interview ${businessCandidate!=='Shortlisted'?'disabled':''}>Move to interview</button><button data-business-reset>Reset example</button></div></div><p class="demo-hint">Try shortlisting, then moving the application to interview. No interview invitation is sent.</p>`;
 }else if(businessView==='portal'){

 }else if(businessView==='jobs'){

 }else{

 }
}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let changed=false;

function home(){return `<section class="landing-band"><div class="wrap"><div class="hero hero-grid"><div class="hero-copy"><div class="eyebrow"><span class="equip-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Technology, with people in mind</div><h1>Tailormade<br><span>technology.</span></h1><p class="intro">Apps, connected systems and automation built around your organisation and the people who use them.</p><div class="actions">${button('Find your starting point','#audiences')}${button('Explore the school demo','#/schools?demo=sports',true)}</div><div class="hero-footnote"><span class="equip-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Ready-made. Made to fit. Built for you.</div></div><div class="hero-product"><div class="product-shell"><div class="product-chrome"><span class="chrome-dots" aria-hidden="true"><i></i><i></i><i></i></span><span>YOUR SCHOOL. CONNECTED.</span><span aria-hidden="true">&#8599;</span></div><div class="hero-scoreboard"><div class="hs-heading"><span>CRICKET / U13 A</span><span class="hs-live">LIVE MATCH</span></div><div class="hs-fixture"><span>Ridgeway <small>vs Oakfield</small></span><span class="hs-school">R</span></div><div class="hs-total">124<span>/3</span></div><div class="hs-meta">16.2 overs <span>First innings</span></div><div class="hs-over"><span>THIS OVER</span><b>1</b><b class="hs-boundary">4</b><b>0</b><b>1</b><b class="hs-boundary">6</b><b>2</b></div><div class="hs-player"><div class="hs-avatar">AM</div><div><strong>Alex Morgan</strong><small>Batting now</small></div><strong class="hs-runs">42<sup>*</sup><small>28 balls</small></strong></div><div class="hs-season"><span>PLAYER'S SEASON</span><div><strong>286<small>Runs</small></strong><strong>35.8<small>Average</small></strong><strong>12<small>Wickets</small></strong></div></div><div class="hs-disclosure">Illustrative demo · Fictional school and player</div></div><div class="product-bottom"><span class="product-dot"></span> Illustrative school sports platform <span>01 / 05</span></div></div><div class="floating-note"><span class="note-icon" aria-hidden="true">&#10003;</span><div><strong>Comprehensive live scoring and stats tracker.</strong></div></div></div></div></div></section><section class="audience-section wrap" id="audiences"><div class="audience-heading"><div><div class="eyebrow"><span class="equip-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Who are we building for?</div><h2>Find your fit.</h2></div><p>Different organisations.<br>The same personal approach.</p></div><div class="route-grid">${[['Schools','Sport, calendars, communication and the work behind the school day.'],['Businesses','Practical tools for your team, your processes and your everyday work.'],['Agencies','Connected workflows and tools shaped around how your agency operates.']].map(([name,desc],i)=>`<a class="route route-${name.toLowerCase()}" href="#/${name.toLowerCase()}"><div class="route-top"><span class="route-icon" aria-hidden="true">${['<svg viewBox="0 0 32 32"><path d="M4 14 16 7l12 7-12 7zM9 18v7c5 4 9 4 14 0v-7M28 14v10"/></svg>','<svg viewBox="0 0 32 32"><rect x="5" y="10" width="22" height="17" rx="3"/><path d="M11 10V6h10v4M5 18h22M14 18v4h4v-4"/></svg>','<svg viewBox="0 0 32 32"><rect x="4" y="4" width="9" height="9" rx="2"/><rect x="19" y="19" width="9" height="9" rx="2"/><path d="M19 8h5v7M8 19v5h7"/></svg>'][i]}</span><span class="arrow" aria-hidden="true">&#8599;</span></div><h3>${name}</h3><p>${desc}</p><span class="route-link">Explore ${name.toLowerCase()} <span aria-hidden="true">&#8594;</span></span></a>`).join('')}</div></section>${ways()}<section class="section personal-section"><div class="wrap feature-layout"><div>${heading('The personal part','We sit with the people<br>doing the work.')}</div><div><p class="intro">Tell us where things get slow, repetitive or complicated.</p><p>We take time to understand how your organisation works. Then we build or adapt technology to make the work easier, simpler and faster.</p>${button('Explore your school’s technology','#/schools',true)}</div></div></section>${cta()}`}
function schools(){return `<div class="wrap"><section class="hero school-hero hero-grid"><div><div class="eyebrow"><span class="equip-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Equip for schools</div><h1>Explore your school’s technology</h1><p class="intro">From the touchline to the school office. Apps and systems built around your school day.</p><div class="actions">${button('View the demo','#sports')}${button('Discuss your school','#/enquiry?type=School',true)}</div></div><div>${scorePreview()}<p class="product-caption">Anonymised interface examples and synthetic data. No connection to a school account.</p></div></section></div><section class="section" id="sports"><div class="wrap feature-layout"><div class="feature-copy">${heading('01 / Your school’s sports platform','Every team.<br>Every season.<br>A personal connection.')}<p>A parent follows their child’s match. A player looks back on their season. A coach manages their team. Your school celebrates its sport.</p><ul><li>Multi-sport teams, fixtures, live scores and results.</li><li>Individual statistics, season records and progress.</li><li>School branding and appropriate access for parents, coaches and heads of sport.</li></ul><p class="review-note">Explore fixtures, results, player statistics and sports management. Demonstrations use fictional data; features and access are agreed for your school.</p></div><div><div class="panel">${panelTop}<div class="demo-toolbar" aria-label="Sports demonstration views"><button class="tab" data-sport-view="match" aria-pressed="true">Live match</button><button class="tab" data-sport-view="player" aria-pressed="false">Player season</button><button class="tab" data-sport-view="team" aria-pressed="false">Team & fixtures</button><button class="tab" data-sport-view="results" aria-pressed="false">Results</button><button class="tab" data-sport-view="honours" aria-pressed="false">Top performers</button><button class="tab" data-sport-view="office" aria-pressed="false">Sports office</button><select class="sport-select" id="sport" aria-label="Choose demo sport"><option>Cricket</option><option>Hockey</option><option>Netball</option><option>Rugby</option><option>Tennis</option></select></div><div class="dashboard" id="sports-content"></div></div><p class="product-caption">Interactive illustration · Try scoring a match or switching views.</p></div></div></section><section class="section" id="calendar"><div class="wrap feature-layout"><div class="feature-copy">${heading('02 / Calendars & week ahead','One school week.<br>A clearer picture.')}<p>Bring sport, academics, culture and events into a coordinated calendar. Give staff and families a useful view of what’s coming.</p><p>A searchable school calendar and sports week ahead can help families find the activities that matter to them. Explore category filters and useful weekly views. Capture an event once and reuse the information in weekly schedules. Connections to existing calendars would depend on the systems and access available.</p><span class="pill">Coordinated schedules</span><span class="pill">Useful weekly views</span><span class="pill">Less recreating</span></div><div class="panel">${panelTop}<div class="dashboard"><span class="tag">School calendar</span><h3>The week ahead</h3><p class="quiet">Illustrative week · 2–6 November 2026</p><div class="demo-toolbar" style="padding-left:0"><button class="tab" data-calendar="all" aria-pressed="true">All</button><button class="tab" data-calendar="sport" aria-pressed="false">Sport</button><button class="tab" data-calendar="academic" aria-pressed="false">Academics</button><button class="tab" data-calendar="culture" aria-pressed="false">Culture</button></div><div id="calendar-content"></div><button class="button light" id="week-toggle" style="margin-top:16px">View family week ahead ↗</button><p class="demo-hint">Concept for custom development · Both views use the same demonstration events.</p></div></div></div></section><section class="section"><div class="wrap feature-layout"><div class="feature-copy">${heading('03 / Communication & school app','The right update.<br>For the right people.')}<p>A school-branded experience for relevant notices, group updates and event information.</p><p>Explore how a parent could see updates for their child’s groups, while staff see the information they need for the school day.</p><p class="quiet">Concept for custom development. Delivery channels, permissions and any links to existing communication tools would be agreed during discovery.</p></div><div class="panel">${panelTop}<div class="dashboard"><h3>Your school updates</h3><div class="demo-toolbar" style="padding-left:0"><button class="tab" data-audience="parent" aria-pressed="true">Parent view</button><button class="tab" data-audience="staff" aria-pressed="false">Staff view</button></div><div id="notices-content"></div><p class="demo-hint">Illustrative audience filtering only; no real accounts or messages.</p></div></div></div></section><section class="section"><div class="wrap feature-layout"><div class="feature-copy">${heading('04 / Internal systems & automation','Less chasing.<br>Clearer tracking.')}<p>Replace paper trails and duplicate capture with a process people can follow.</p><p>Online forms, requests, approvals, bookings, equipment tracking, registrations, dashboards and reminders can be designed around everyday school work.</p><p class="quiet">Concept for custom development · Try a simple equipment request on the right.</p></div><div class="panel">${panelTop}<div class="dashboard"><span class="tag">Equipment requests / EQ-014</span><h3>Ready for Saturday’s fixture</h3><div class="request"><strong>Cricket match kit</strong><p class="quiet">2 kit bags · U13 A · Saturday, 7 November</p><div class="steps" id="request-steps"></div><p id="request-status" class="quiet" aria-live="polite"></p><div class="demo-actions"><button id="request-advance">Approve request</button><button id="request-reset">Reset demo</button></div></div><p class="demo-hint">Interactive example using fictional requests. No real bookings or messages are created.</p></div></div></div></section><section class="section"><div class="wrap feature-layout"><div>${heading('05 / Built around your school','Start with the thing that isn’t working.')}</div><div><p class="intro">A particular problem doesn’t always need a whole new platform.</p><p>We can assess the workflow, create a suitable tool or explore connecting existing systems where technically possible.</p><p>Your school may already use tools such as d6 or SportsCap. Equip can explore specific needs alongside your existing setup. Compatibility and access need to be checked before any integration is promised.</p>${button('Tell us what needs improving','#/enquiry?type=School',true)}</div></div></section>${ways()}${process()}${cta(true)}`}
function audiencePage(type){let business=type==='Businesses';return `<div class="wrap"><section class="hero page-intro"><div class="eyebrow"><span class="equip-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Equip for ${type.toLowerCase()}</div><h1>Technology that fits<br>the way you work.</h1><p class="intro">${business?'Apps, connected systems and automation shaped around your business and your team.':'Practical technology for the people, projects and processes behind your agency.'}</p><p>Start with a task that takes too long, information that gets captured twice, or a workflow that needs a clearer home. We’ll explore whether an existing system, an adaptation or a custom tool makes sense.</p><div class="actions">${button('Tell us what you need',`#/enquiry?type=${business?'Business':'Agency'}`)}</div><p class="quiet">We’re developing this offer through conversations with ${business?'businesses':'agencies of different kinds'}. Let’s start with your specific needs.</p></section></div>${ways()}${process()}${cta()}`}

iv><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="200"></div><div class="field"><label for="type">Organisation type</label><select id="type" name="type" required><option value="">Please choose</option>${['School','Business','Agency','Other'].map(x=>`<option ${x===type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="description">What would you like to improve?</label><textarea id="description" name="message" rows="5" required maxlength="3000" placeholder="Tell us about the task, problem or idea."></textarea></div><p class="contact-privacy">Your details will be processed by FormSubmit to forward your enquiry to Equip. Please don&#8217;t include learner details or sensitive information.</p><button type="submit" class="button">Send enquiry <span aria-hidden="true">&#8594;</span></button><p class="contact-service">You may be asked to complete a security check before submitting.</p></form></section></div>`}

let sportView='match',sport='Cricket',runs=124,wickets=3,balls=98,history=[],calendarFilter='all',agenda=false,requestStep=0;
function sportsRender(){if(sport==="Tennis"){renderTennis();return;}if(["results","honours","office"].includes(sportView)){renderBuiltExamples();return;}const box=document.querySelector('#sports-content');if(!box)return;const cricket=sport==='Cricket';if(sportView==='match'){box.innerHTML=cricket?`<div class="score-line"><span class="tag">U13 A · Cricket</span><span class="live">LIVE DEMO</span></div><div class="match-card"><div class="score-line"><div><div class="team">Ridgeway vs Oakfield</div><p>First innings · Ridgeway batting</p></div><div aria-live="polite" aria-atomic="true"><strong>${runs}/${wickets}</strong><p>${Math.floor(balls/6)}.${balls%6} overs</p></div></div><div class="over-balls">${(history.length?history.slice(-6).map(x=>x.label):['1','4','0','1','6','2']).map(x=>`<span class="ball ${x==='4'||x==='6'?'boundary':''}">${x}</span>`).join('')}</div></div><div class="demo-actions">${[0,1,2,4,6].map(n=>`<button data-run="${n}" ${wickets>=10?'disabled':''}>${n===0?'Dot':`+${n} run${n>1?'s':''}`}</button>`).join('')}<button data-wicket ${wickets>=10?'disabled':''}>Wicket</button><button data-undo ${!history.length?'disabled':''}>Undo</button><button data-score-reset>Reset</button></div><p class="demo-hint">Try the scoring controls. This is a simplified score illustration, not a full scoring engine.</p>`:`<span class="tag">${sport} · Multi-sport concept</span><h3>Ridgeway vs Oakfield</h3><div class="match-card"><div class="score-line"><div><div class="team">Ridgeway</div><p>${sport==='Tennis'?'Sets won':'Illustrative match score'}</p></div><strong id="other-score" aria-live="polite">${otherScore} : ${sport==='Rugby'?12:1}</strong><div class="team">Oakfield</div></div></div><div class="demo-actions"><button id="other-add">${sport==='Rugby'?'+5 points':sport==='Tennis'?'+1 set':'+1 goal'} to Ridgeway</button><button id="other-reset">Reset</button></div><p class="demo-hint">Concept for custom development. Sport-specific rules, scoring and statistics would be scoped separately.</p>`;}else if(sportView==='player'){box.innerHTML=`<span class="tag">${sport} · Personal season</span><div class="profile"><div class="avatar">AM</div><div><h3>Alex Morgan</h3><span class="quiet">U13 A · Synthetic player profile</span></div></div><div class="mini-stats">${(cricket?[['286','Runs'],['35.8','Average'],['12','Wickets']]:sport==='Tennis'?[['8','Matches'],['6','Wins'],['2','Losses']]:[['8','Matches'],['6','Goals / scores'],['5','Team wins']]).map(([n,t])=>`<div><strong>${n}</strong><span>${t}</span></div>`).join('')}</div><p class="quiet" style="margin-top:25px">${cricket?'Runs in the last five innings':'Matches played by month'}</p><div class="bars" role="img" aria-label="${cricket?'Last five innings: 24, 42, 18, 56 and 38 runs.':'Matches played May to September: 1, 2, 1, 3 and 1.'}">${(cricket?[24,42,18,56,38]:[1,2,1,3,1]).map(n=>`<div style="height:${cricket?n/56*85:n/3*85}%"><span>${n}</span></div>`).join('')}</div><div class="chart-label">${(cricket?['01','02','03','04','05']:['May','Jun','Jul','Aug','Sep']).map(n=>`<span>${n}</span>`).join('')}</div><div class="role-note">Parent view concept: follow your own child’s matches, results and season. Real access requires verified accounts and school-approved permissions.</div>`;}else box.innerHTML=`<span class="tag">${sport} · Team management</span><h3>U13 A · Team & fixtures</h3><label for="role">Explore a role</label><select id="role"><option>Coach</option><option>Head of sport</option><option>Parent</option></select><div id="role-content"></div>`;
if(sportView==='team')renderRole('Coach');}

function renderRole(role){document.querySelector('#role-content').innerHTML=`<div class="role-note">${role==='Coach'?'Coach concept: your team, squad availability and upcoming fixtures.':role==='Head of sport'?'Head-of-sport concept: a school-wide overview of teams, results and schedules.':'Parent concept: fixtures and updates for your own child’s teams.'}</div>${(role==='Head of sport'?[['Cricket · U13 A','Sat 7 Nov · Oakfield'],['Netball · U12 A','Thu 5 Nov · Hillcrest'],['Hockey · U13 B','Fri 6 Nov · Riverside']]:[[`${sport} · U13 A`,'Sat 7 Nov · Oakfield'],[`${sport} · U13 A`,'Sat 14 Nov · Riverside']]).map(([a,b])=>`<div class="fixture"><strong>${a}</strong><span>${b}</span></div>`).join('')}<p class="demo-hint">Illustrative role switch. This control does not grant real access.</p>`}

function requestRender(){document.querySelector('#request-steps').innerHTML=['Requested','Approved','Collected'].map((x,i)=>`<span class="${i<=requestStep?'done':''}">${x}</span>`).join('');document.querySelector('#request-status').textContent=['Awaiting approval from the sports office.','Approved. Kit is ready to be collected.','Collection recorded. Request complete.'][requestStep];const b=document.querySelector('#request-advance');b.textContent=['Approve request','Mark as collected','Request complete'][requestStep];b.disabled=requestStep===2;}
function route(){const raw=location.hash.slice(1)||'/',[path,query]=raw.split('?');const params=new URLSearchParams(query);const key=path.replace('/','');main.innerHTML=key==='schools'?schools():key==='businesses'?businessPage():key==='agencies'?audiencePage('Agencies'):key==='enquiry'?enquiry(params.get('type')):home();document.title=`Equip | ${key==='schools'?'Technology for schools':key==='enquiry'?'Tell us what you need':key==='businesses'?'Technology for businesses':key==='agencies'?'Technology for agencies':'Tailormade technology.'}`;document.querySelectorAll('nav a').forEach(a=>{a.removeAttribute('aria-current');if(a.getAttribute('href').split('?')[0]==='#'+path)a.setAttribute('aria-current','page')});if(key==='businesses'){businessView='hiring';resetBusinessExample();renderBusinessDemo();}if(key==='schools'){calendarFilter='all';agenda=false;requestStep=0;sportView='match';sport='Cricket';sportsRender();calendarRender();noticesRender('parent');requestRender();}window.scrollTo(0,0);if(params.get('demo'))document.querySelector('#sports')?.scrollIntoView();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.sportView){sportView=b.dataset.sportView;document.querySelectorAll('[data-sport-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));sportsRender();}if(b.hasAttribute('data-run')||b.hasAttribute('data-wicket')){history.push({runs,wickets,balls,label:b.hasAttribute('data-wicket')?'W':b.dataset.run});if(b.hasAttribute('data-wicket'))wickets++;else runs+=Number(b.dataset.run);balls++;sportsRender();}if(b.hasAttribute('data-undo')){const prev=history.pop();if(prev)({runs,wickets,balls}=prev);sportsRender();}if(b.hasAttribute('data-score-reset')){runs=124;wickets=3;balls=98;history=[];sportsRender();}if(b.id==='other-add'){otherScore+=sport==='Rugby'?5:1;sportsRender();}if(b.id==='other-reset'){otherScore=2;sportsRender();}if(b.dataset.calendar){calendarFilter=b.dataset.calendar;document.querySelectorAll('[data-calendar]').forEach(x=>x.setAttribute('aria-pressed',x===b));calendarRender();}if(b.id==='week-toggle'){agenda=!agenda;calendarRender();}if(b.dataset.audience){document.querySelectorAll('[data-audience]').forEach(x=>x.setAttribute('aria-pressed',x===b));noticesRender(b.dataset.audience);}if(b.id==='request-advance'){requestStep=Math.min(2,requestStep+1);requestRender();}if(b.id==='request-reset'){requestStep=0;requestRender();}});
document.addEventListener('change',e=>{if(e.target.id==='sport'){sport=e.target.value;otherScore=2;sportsRender();}if(e.target.id==='role')renderRole(e.target.value)});
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/')){route();main.focus({preventScroll:true});}});route();


// Rebuilt from supplied product screenshots; only fictional demo records are rendered.
let honoursPeriod='week';
function renderBuiltExamples(){const box=document.querySelector('#sports-content');if(!box)return;
if(sportView==='results'){box.innerHTML=`<span class="tag">Cricket / Results</span><h3>From the final ball to the result.</h3>${[['U10 A vs Oakfield','Won by 12 runs','29 Oct 2026 / Main oval'],['U11 C vs Oakfield','Won by 34 runs','29 Oct 2026 / East field'],['U9 A vs Riverside','Won by 5 wickets','28 Oct 2026 / Junior oval']].map(([team,result,detail])=>`<article class="example-result"><strong>${team}</strong><span class="result-badge">${result}</span><small>${detail}</small></article>`).join('')}<p class="demo-hint">Example results with fictional teams, venues and scores.</p>`;}
if(sportView==='honours'){const rows=honoursPeriod==='week'?[['Alex Morgan',64],['Jamie Ellis',52],['Sam Taylor',47],['Jordan Lee',39],['Casey Reed',31]]:[['Jamie Ellis',382],['Alex Morgan',341],['Casey Reed',295],['Jordan Lee',268],['Sam Taylor',246]];box.innerHTML=`<span class="tag">Cricket / Top performers</span><h3>Celebrate their season.</h3><div class="demo-actions"><button data-honours="week" aria-pressed="${honoursPeriod==='week'}">Weekly</button><button data-honours="season" aria-pressed="${honoursPeriod==='season'}">Season</button></div><p class="quiet" style="margin-top:18px">${honoursPeriod==='week'?'This week':'2026 season'} / Batting honours</p>${rows.map(([name,runs],i)=>`<div class="honours-row"><span class="honours-rank">${i+1}</span><strong>${name}</strong><span>${runs} runs</span></div>`).join('')}<p class="demo-hint">Example weekly and season honours using fictional players and scores.</p>`;}
if(sportView==='office'){box.innerHTML=`<span class="tag">Head of sport / Overview</span><h3>The work behind the match.</h3><div class="office-grid">${[['Fixtures','Today’s matches and venues'],['Edit teams','Teams and coaches'],['Stats','Players and teams'],['Top performers','Weekly and season honours'],['Parent claims','Review requests for access'],['Team updates','Release teams and manage alerts']].map(([title,desc])=>`<div class="office-item"><strong>${title}</strong><small>${desc}</small></div>`).join('')}</div><p class="role-note">Example sports office. School accounts, team publishing and parent access would be configured for your school.</p>`;}}

</script><script>// Tennis-specific illustrative interface. No real players or connected match data.
let tennisState={sets:[[6,4],[4,3]],points:[2,1],finished:false},tennisUndo=[];
function tennisSnapshot(){return JSON.parse(JSON.stringify(tennisState));}
function tennisPoint(side){
  if(tennisState.finished)return;
  tennisUndo.push(tennisSnapshot());
  const s=tennisState,last=s.sets[s.sets.length-1];
  s.points[side]++;
  const tie=last[0]===6&&last[1]===6,other=1-side;
  if(s.points[side]>=(tie?7:4)&&s.points[side]-s.points[other]>=2){
    last[side]++;s.points=[0,0];
    if(last[side]>=6&&(last[side]-last[other]>=2||last[side]===7)){
      const wins=s.sets.filter(x=>x[side]>x[other]).length;
      if(wins===2)s.finished=true;else s.sets.push([0,0]);
    }
  }
}
function tennisPoints(){const p=tennisState.points,last=tennisState.sets.at(-1);if(tennisState.finished)return ['—','—'];if(last[0]===6&&last[1]===6)return p;if(p[0]>=3&&p[1]>=3)return p[0]===p[1]?['40','40']:p[0]>p[1]?['AD','40']:['40','AD'];return p.map(x=>['0','15','30','40'][x]);}
function renderTennis(){
 const box=document.querySelector('#sports-content');if(!box)return;
 const note='<p class="demo-hint">Tennis demonstration / Fictional players and results. Concept for custom development; no live data.</p>';
 if(sportView==='match'){
  const point=tennisPoints();
  box.innerHTML=`<div class="score-line"><span class="tag">Tennis / U13 singles / Court 2</span><span class="live">${tennisState.finished?'COMPLETE':'LIVE DEMO'}</span></div><h3>Ridgeway vs Oakfield</h3><div class="tennis-court" aria-hidden="true"><div class="court-singles"></div><div class="court-service"></div><div class="court-net"></div><span class="court-ball"></span><span class="court-player player-near"></span><span class="court-player player-far"></span></div><div class="tennis-table-wrap"><table class="tennis-score"><caption class="sr-only">Singles match, best of three sets</caption><thead><tr><th scope="col">Player</th>${tennisState.sets.map((_,i)=>`<th scope="col">Set ${i+1}</th>`).join('')}<th scope="col">Points</th></tr></thead><tbody>${['Alex Morgan','Jamie Parker'].map((name,i)=>`<tr><th scope="row">${name}<small>${i===0?'Ridgeway':'Oakfield'}</small></th>${tennisState.sets.map((set,n)=>`<td class="${n===tennisState.sets.length-1?'current-set':''}">${set[i]}</td>`).join('')}<td class="tennis-points">${point[i]}</td></tr>`).join('')}</tbody></table></div><p class="tennis-state" role="status">${tennisState.finished?'Match complete.':tennisState.sets.at(-1).every(x=>x===6)?'Tie-break / first to 7, win by 2':tennisState.points.every(x=>x>=3)&&tennisState.points[0]===tennisState.points[1]?'Deuce / win by two points':'Best of three sets / advantage scoring'}</p><div class="demo-actions"><button data-tennis-point="0" ${tennisState.finished?'disabled':''}>Point to Alex</button><button data-tennis-point="1" ${tennisState.finished?'disabled':''}>Point to Jamie</button><button data-tennis-undo ${tennisUndo.length?'':'disabled'}>Undo</button><button data-tennis-reset>Reset match</button></div>${note}`;
 }else if(sportView==='results'){
  box.innerHTML=`<span class="tag">Tennis / Recent results</span><h3>Singles & doubles results</h3>${[['U13 singles / Alex Morgan','Won 6–4, 6–3','vs Jamie Parker / Oakfield / Court 2'],['U13 doubles / Casey Reed & Sam Taylor','Won 6–2, 7–5','vs Ellis & Blake / Riverside / Court 1'],['U12 singles / Jordan Lee','Lost 4–6, 6–3, 3–6','vs Riley Brooks / Oakfield / Court 3']].map(([match,result,detail])=>`<article class="example-result"><strong>${match}</strong><span class="result-badge">${result}</span><small>${detail}</small></article>`).join('')}${note}`;
 }else if(sportView==='player'){
  box.innerHTML=`<span class="tag">Tennis / Personal season</span><div class="profile"><div class="avatar">AM</div><div><h3>Alex Morgan</h3><span class="quiet">U13 / Singles & doubles</span></div></div><div class="mini-stats"><div><strong>8</strong><span>Singles matches</span></div><div><strong>6</strong><span>Singles wins</span></div><div><strong>75%</strong><span>Singles win rate</span></div></div><h3 class="tennis-subtitle">Season record</h3><div class="fixture"><strong>Singles</strong><span>6 wins / 2 losses</span></div><div class="fixture"><strong>Doubles</strong><span>4 wins / 1 loss</span></div><div class="fixture"><strong>Singles sets</strong><span>13 won / 6 lost</span></div><p class="quiet" style="margin-top:20px">Last five singles matches</p><div class="tennis-form" aria-label="Last five matches: win, win, loss, win, win">${['W','W','L','W','W'].map(x=>`<span class="${x==='L'?'loss':''}">${x}</span>`).join('')}</div><div class="role-note">Parent view concept: follow your child’s fixtures, match results and tennis season.</div>${note}`;
 }else if(sportView==='team'){
  box.innerHTML=`<span class="tag">Tennis / Teams & fixtures</span><h3>U13 tennis squad</h3><div class="fixture"><strong>Singles 1</strong><span>Alex Morgan</span></div><div class="fixture"><strong>Singles 2</strong><span>Jordan Lee</span></div><div class="fixture"><strong>Doubles pair</strong><span>Casey Reed & Sam Taylor</span></div><h3 class="tennis-subtitle">Coming up</h3><article class="example-result"><strong>Ridgeway vs Oakfield</strong><small>Tue 3 Nov / 14:00 / Courts 1–3</small><span class="pill">Singles & doubles</span></article><article class="example-result"><strong>Ridgeway vs Riverside</strong><small>Tue 10 Nov / 14:30 / Riverside courts</small><span class="pill">Singles & doubles</span></article>${note}`;
 }else if(sportView==='honours'){
  const season=honoursPeriod==='season';const rows=season?[['Alex Morgan','6 wins / 8 matches'],['Casey Reed','5 wins / 7 matches'],['Sam Taylor','4 wins / 6 matches']]:[['Alex Morgan','2 wins / 2 matches'],['Casey Reed','1 win / 1 match'],['Sam Taylor','1 win / 2 matches']];
  box.innerHTML=`<span class="tag">Tennis / Top performers</span><h3>Singles match wins</h3><div class="demo-actions"><button data-tennis-period="week" aria-pressed="${!season}">Weekly</button><button data-tennis-period="season" aria-pressed="${season}">Season</button></div><p class="quiet" style="margin-top:18px">${season?'2026 season':'This week'} / Ranked by wins, then win rate</p>${rows.map(([name,record],i)=>`<div class="honours-row"><span class="honours-rank">${i+1}</span><strong>${name}</strong><span>${record}</span></div>`).join('')}${note}`;
 }else{
  box.innerHTML=`<span class="tag">Tennis / Sports office</span><h3>Manage the day on court.</h3><div class="office-grid">${[['Fixtures','Singles and doubles schedules'],['Squad','Players and doubles pairings'],['Courts','Court and time allocations'],['Results','Set scores and match outcomes'],['Player records','Match wins and season records'],['Parent access','Review access requests']].map(([title,desc])=>`<div class="office-item"><strong>${title}</strong><small>${desc}</small></div>`).join('')}</div><div class="role-note">Illustrative management areas only. No bookings, messages or access approvals are made.</div>${note}`;
 }
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||sport!=='Tennis')return;
 if(b.hasAttribute('data-tennis-point')){tennisPoint(Number(b.dataset.tennisPoint));renderTennis();document.querySelector('[data-tennis-point="'+b.dataset.tennisPoint+'"]')?.focus();}
 if(b.hasAttribute('data-tennis-undo')){if(tennisUndo.length)tennisState=tennisUndo.pop();renderTennis();}
 if(b.hasAttribute('data-tennis-reset')){tennisState={sets:[[6,4],[4,3]],points:[2,1],finished:false};tennisUndo=[];renderTennis();}
 if(b.dataset.tennisPeriod){honoursPeriod=b.dataset.tennisPeriod;renderTennis();}
});
